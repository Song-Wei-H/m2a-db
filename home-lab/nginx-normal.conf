pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    server_tokens on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/mode-b-target;

        # Preserve all conditions except the approved backup directory fixture.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "mode-b-target-ready\n";
        }

        location ^~ /lab/ {
            proxy_pass http://mode-b-l2-auth:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Test-Case-ID $http_x_test_case_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_buffering off;
        }

        location /backup/ {
            autoindex off;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
